# Test profile: same roles, but against melocoton_test (DI-19).
spring:
  datasource:
    url: ${TEST_DB_URL}
  flyway:
    url: ${TEST_DB_URL}
    # Allowed only here: CleanTestDatabaseConfig wipes melocoton_test before migrating.
    clean-disabled: false

# Fixed here so tests do not depend on each developer's .env.
melocoton:
  cors:
    allowed-origin: http://localhost:5173
  session:
    # Test-only key (base64 of 35 bytes); production reads JWT_SECRET.
    secret: dGVzdC1vbmx5LXNlY3JldC1mb3ItbWVsb2NvdG9uLWFwaSE=
    inactivity: 30d
